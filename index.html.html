<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D França Barbearia</title>
<meta name="description" content="D França Barbearia. Seu estilo, nossa assinatura. Agende seu horário online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#121212;--line:#2a2a2a;--gold:#D4AF37;--gold2:#f0d77a;--tx:#fff;--mut:#a8a8a8;--err:#ff6b6b;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Outfit",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 16px/1.6 var(--sans);-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
section{padding:72px 0;border-top:1px solid var(--line)}
h2{font:600 clamp(32px,6vw,48px)/1.1 var(--serif);color:var(--gold);margin-bottom:28px}
.btn{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:2px;padding:14px 28px;font:600 16px var(--sans);cursor:pointer;text-decoration:none;transition:background .2s}
.btn:hover{background:var(--gold2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn.ghost:hover{background:rgba(212,175,55,.12)}
header{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font:700 24px var(--serif);color:var(--gold);text-decoration:none}
nav a{margin-left:20px;text-decoration:none;color:var(--mut);font-size:15px}
nav a:hover{color:var(--tx)}
@media(max-width:640px){nav a.h{display:none}}
.hero{min-height:82vh;display:flex;align-items:center;border:0;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:6%;top:0;bottom:0;width:14px;background:repeating-linear-gradient(-45deg,var(--gold) 0 14px,#000 14px 28px,#fff 28px 42px,#000 42px 56px);opacity:.9}
.hero h1{font:700 clamp(64px,16vw,168px)/.9 var(--serif);letter-spacing:-.02em}
.hero h1 span{display:block;font-size:.38em;color:var(--gold);letter-spacing:.01em;margin-top:10px}
.hero p{font:500 clamp(20px,3vw,28px) var(--serif);color:var(--mut);margin:26px 0 34px;font-style:italic}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);padding:22px}
.price{font:600 30px var(--serif);color:var(--gold)}
.card small{color:var(--mut)}
.barber{display:flex;gap:16px;align-items:center}
.ph{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex:none;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font:700 40px var(--serif);color:var(--gold)}
.barber h3,.card h3{font:600 24px var(--serif)}
.barber p{color:var(--mut);font-size:15px}
/* agendamento */
#agendar{background:var(--panel)}
.steps{display:flex;gap:6px;margin-bottom:24px}
.steps i{flex:1;height:4px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--gold)}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:18px;text-align:left;cursor:pointer;font:400 16px var(--sans);display:flex;gap:14px;align-items:center;border-radius:2px}
.opt:hover,.opt.sel{border-color:var(--gold)}
.opt.sel{background:rgba(212,175,55,.1)}
.opt .ph{width:64px;height:64px;font-size:28px}
.opt b{display:block;font:600 20px var(--serif)}
.days,.slots{display:flex;gap:8px;flex-wrap:wrap}
.days{overflow-x:auto;flex-wrap:nowrap;padding-bottom:8px}
.chip{background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:10px 14px;cursor:pointer;font:400 15px var(--sans);text-align:center;min-width:64px;border-radius:2px}
.chip:hover:not(:disabled){border-color:var(--gold)}
.chip.sel{background:var(--gold);color:#000;border-color:var(--gold)}
.chip:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.chip small{display:block;color:inherit;opacity:.7;font-size:12px}
label{display:block;margin:0 0 16px;color:var(--mut);font-size:15px}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:14px;font:400 16px var(--sans);margin-top:6px;border-radius:2px}
input:focus{border-color:var(--gold);outline:0}
.sum{border:1px solid var(--gold);padding:20px;margin-bottom:20px}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0}
.sum span{color:var(--mut)}
.nav{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.msg{margin-top:14px;color:var(--err);min-height:24px}
.ok{text-align:center;padding:24px 0}
.ok h3{font:600 36px var(--serif);color:var(--gold);margin-bottom:10px}
table{border-collapse:collapse;width:100%;max-width:420px}
td{padding:8px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;color:var(--gold)}
footer{padding:36px 0 calc(36px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line);color:var(--mut);text-align:center;font-size:14px}
footer .logo{display:block;margin-bottom:6px}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));background:#25D366;color:#000;font-weight:600;text-decoration:none;padding:12px 18px;border-radius:30px;display:none;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.5)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="#topo">D França</a>
<nav><a class="h" href="#servicos">Serviços</a><a class="h" href="#equipe">Barbeiros</a><a class="h" href="#info">Horários</a><a href="#agendar" style="color:var(--gold)">Agendar</a></nav></div></header>

<section class="hero" id="topo"><div class="wrap">
<h1>D França<span>Barbearia</span></h1>
<p>Seu estilo, nossa assinatura.</p>
<div class="row"><a class="btn" href="#agendar">Agendar horário</a><a class="btn ghost" href="#servicos">Ver serviços</a></div>
</div></section>

<section id="servicos"><div class="wrap"><h2>Serviços e preços</h2><div class="cards" id="svcList"><p>Carregando…</p></div></div></section>

<section id="equipe"><div class="wrap"><h2>Conheça nossos barbeiros</h2><div class="cards" id="barbList"><p>Carregando…</p></div></div></section>

<section id="agendar"><div class="wrap"><h2>Agende seu horário</h2>
<div class="steps" id="steps"></div><div id="stage"></div><div class="msg" id="msg" role="alert"></div></div></section>

<section id="info"><div class="wrap"><h2>Horário de funcionamento</h2>
<table id="hoursTbl"></table>
<p id="addr" style="margin-top:24px;color:var(--mut)"></p></div></section>

<footer><div class="wrap"><a class="logo" href="#topo">D França Barbearia</a>Seu estilo, nossa assinatura.<div id="social" style="margin-top:10px"></div></div></footer>
<a class="wa" id="waBtn" target="_blank" rel="noopener">WhatsApp</a>

<script>
/* ===== CONFIGURAÇÃO (apenas chaves públicas) ===== */
const CFG={
  URL:"https://guszllkmcmbgjtcvjpen.supabase.co", // confira em Project Settings
  KEY:"sb_publishable_gHOUHrw4cvpxFqHS5P7WKQ_sAhQnDX4",
  WHATSAPP:"5541984495122",
  ADDRESS:"Rua Professor Alfredo Valente, 445 - Jardim Roma, Almirante Tamandaré/PR, 83504-000",
  INSTAGRAM:"https://www.instagram.com/barbearia_dfranca_"
};
const STEP=40, TZ="-03:00";
const H={apikey:CFG.KEY,Authorization:"Bearer "+CFG.KEY,"Content-Type":"application/json"};
const api=async(path,opt={})=>{const r=await fetch(CFG.URL+"/rest/v1/"+path,{headers:H,...opt});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||"erro");return j};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const DIAS=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const ERR={horario_ocupado:"Esse horário acabou de ser ocupado. Escolha outro.",horario_passado:"Esse horário já passou.",
  horario_bloqueado:"Esse horário não está disponível.",horario_em_pausa:"Esse horário está em pausa.",dia_fechado:"A barbearia não abre nesse dia.",
  horario_fora_do_expediente:"Horário fora do expediente.",dados_invalidos:"Confira o nome e o telefone com DDD.",
  servico_invalido:"Serviço indisponível.",barbeiro_invalido:"Barbeiro indisponível."};

let services=[],barbers=[],hours={},S={step:0,svc:null,barber:null,date:null,time:null,name:"",phone:""};

const photo=(b,cls="ph")=>b.photo_path
  ?`<img class="${cls}" src="${CFG.URL}/storage/v1/object/public/barber-photos/${encodeURIComponent(b.photo_path)}" alt="${esc(b.name)}">`
  :`<div class="${cls}" aria-hidden="true">${esc(b.name[0])}</div>`;

async function init(){
  try{
    [services,barbers]=await Promise.all([api("services?select=*&active=eq.true&order=price.desc"),api("barbers?select=*&active=eq.true&order=name")]);
    (await api("business_hours?select=*&order=weekday")).forEach(h=>hours[h.weekday]=h);
  }catch(e){$("#msg").textContent="Não foi possível carregar os dados. Tente novamente em instantes.";return}
  $("#svcList").innerHTML=services.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><div class="price">${brl(s.price)}</div><small>${s.duration_min} minutos</small></div>`).join("");
  $("#barbList").innerHTML=barbers.map(b=>`<div class="card barber">${photo(b)}<div><h3>${esc(b.name)}</h3><p>${esc(b.bio||"")}</p></div></div>`).join("");
  $("#hoursTbl").innerHTML=[1,2,3,4,5,6,0].map(d=>{const h=hours[d];
    return `<tr><td>${DIAS[d]}</td><td>${h&&h.is_open?h.open_time.slice(0,5)+" às "+h.close_time.slice(0,5):"Fechado"}</td></tr>`}).join("");
  if(CFG.ADDRESS)$("#addr").innerHTML=`${esc(CFG.ADDRESS)} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CFG.ADDRESS)}" target="_blank" rel="noopener" style="color:var(--gold)">Abrir no mapa</a>`;
  if(CFG.INSTAGRAM)$("#social").innerHTML=`<a href="${esc(CFG.INSTAGRAM)}" target="_blank" rel="noopener" style="color:var(--gold)">Instagram</a>`;
  if(CFG.WHATSAPP){const w=$("#waBtn");w.href="https://wa.me/"+CFG.WHATSAPP;w.style.display="block"}
  render();
}

function steps(){$("#steps").innerHTML=[0,1,2,3,4,5].map(i=>`<i class="${i<=S.step?"on":""}"></i>`).join("")}
function go(n){S.step=n;$("#msg").textContent="";render()}

function render(){
  steps();const st=$("#stage");
  if(S.step===0){
    st.innerHTML=`<p style="margin-bottom:14px;color:var(--mut)">Qual serviço você quer?</p><div class="opts">${services.map(s=>
      `<button class="opt ${S.svc?.id===s.id?"sel":""}" data-s="${s.id}"><span><b>${esc(s.name)}</b>${brl(s.price)} · ${s.duration_min} min</span></button>`).join("")}</div>`;
    st.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.svc=services.find(s=>s.id===b.dataset.s);go(1)});
  }else if(S.step===1){
    st.innerHTML=`<p style="margin-bottom:14px;color:var(--mut)">Com quem você quer ser atendido?</p><div class="opts">${barbers.map(b=>
      `<button class="opt ${S.barber?.id===b.id?"sel":""}" data-b="${b.id}">${photo(b)}<span><b>${esc(b.name)}</b></span></button>`).join("")}</div>
      <div class="nav"><button class="btn ghost" id="bk">Voltar</button></div>`;
    st.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{S.barber=barbers.find(x=>x.id===b.dataset.b);S.date=S.time=null;go(2)});
    $("#bk").onclick=()=>go(0);
  }else if(S.step===2){
    const t=new Date(),days=[];
    for(let i=0;i<30;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);days.push(d)}
    st.innerHTML=`<p style="margin-bottom:14px;color:var(--mut)">Escolha o dia</p><div class="days">${days.map(d=>{
      const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      const h=hours[d.getDay()],open=h&&h.is_open;
      return `<button class="chip ${S.date===iso?"sel":""}" data-d="${iso}" ${open?"":"disabled"}>${DIAS[d.getDay()].slice(0,3)}<small>${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}</small></button>`}).join("")}</div>
      <div class="nav"><button class="btn ghost" id="bk">Voltar</button></div>`;
    st.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.date=b.dataset.d;S.time=null;go(3)});
    $("#bk").onclick=()=>go(1);
  }else if(S.step===3){
    st.innerHTML=`<p style="margin-bottom:14px;color:var(--mut)">Horários livres de ${esc(S.barber.name)} em ${S.date.split("-").reverse().join("/")}</p><div class="slots" id="sl">Carregando…</div>
      <div class="nav"><button class="btn ghost" id="bk">Voltar</button></div>`;
    $("#bk").onclick=()=>go(2);loadSlots();
  }else if(S.step===4){
    st.innerHTML=`<label>Nome completo<input id="nm" autocomplete="name" value="${esc(S.name)}"></label>
      <label>Telefone com WhatsApp (com DDD)<input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="(41) 99999-9999" value="${esc(S.phone)}"></label>
      <div class="nav"><button class="btn ghost" id="bk">Voltar</button><button class="btn" id="nx">Continuar</button></div>`;
    $("#bk").onclick=()=>go(3);
    $("#nx").onclick=()=>{S.name=$("#nm").value.trim();S.phone=$("#ph").value.trim();
      if(S.name.length<3)return $("#msg").textContent="Digite seu nome completo.";
      if(S.phone.replace(/\D/g,"").length<10)return $("#msg").textContent="Digite o telefone com DDD.";go(5)};
  }else if(S.step===5){
    st.innerHTML=`<div class="sum"><div><span>Cliente</span><b>${esc(S.name)}</b></div><div><span>Serviço</span><b>${esc(S.svc.name)}</b></div>
      <div><span>Preço</span><b>${brl(S.svc.price)}</b></div><div><span>Barbeiro</span><b>${esc(S.barber.name)}</b></div>
      <div><span>Data</span><b>${S.date.split("-").reverse().join("/")}</b></div><div><span>Horário</span><b>${S.time}</b></div></div>
      <div class="nav"><button class="btn ghost" id="bk">Voltar</button><button class="btn" id="ok">Confirmar agendamento</button></div>`;
    $("#bk").onclick=()=>go(4);$("#ok").onclick=confirmar;
  }else{
    st.innerHTML=`<div class="ok"><h3>Horário agendado!</h3><p>${esc(S.name)}, esperamos você no dia ${S.date.split("-").reverse().join("/")} às ${S.time} com ${esc(S.barber.name)}.</p>
      <div class="nav" style="justify-content:center"><button class="btn" id="nw">Fazer outro agendamento</button></div></div>`;
    $("#nw").onclick=()=>{S={step:0,svc:null,barber:null,date:null,time:null,name:"",phone:""};render()};
  }
}

async function loadSlots(){
  const h=hours[new Date(S.date+"T12:00:00").getDay()],box=$("#sl");
  try{
    const busy=await api("rpc/busy_slots",{method:"POST",body:JSON.stringify({p_barber:S.barber.id,p_day:S.date})});
    const [oh,om]=h.open_time.split(":").map(Number),[ch,cm]=h.close_time.split(":").map(Number);
    const open=oh*60+om,close=ch*60+cm,bs=h.break_start&&h.break_start.split(":").map(Number),be=h.break_end&&h.break_end.split(":").map(Number);
    const list=[];
    for(let m=open;m<close;m+=STEP){
      if(bs&&be&&m>=bs[0]*60+bs[1]&&m<be[0]*60+be[1])continue;
      const hh=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
      const a=new Date(`${S.date}T${hh}:00${TZ}`),b=new Date(a.getTime()+S.svc.duration_min*60000);
      const taken=a<=new Date()||busy.some(x=>new Date(x.starts_at)<b&&new Date(x.ends_at)>a);
      list.push({hh,taken});
    }
    const free=list.filter(x=>!x.taken);
    box.innerHTML=free.length?free.map(x=>`<button class="chip" data-t="${x.hh}">${x.hh}</button>`).join(""):"Sem horários livres nesse dia. Escolha outra data.";
    box.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.time=b.dataset.t;go(4)});
  }catch(e){box.textContent="Não foi possível carregar os horários. Tente novamente."}
}

async function confirmar(){
  const btn=$("#ok");btn.disabled=true;btn.textContent="Confirmando…";$("#msg").textContent="";
  try{
    await api("rpc/create_appointment",{method:"POST",body:JSON.stringify({p_name:S.name,p_phone:S.phone,p_service:S.svc.id,p_barber:S.barber.id,p_start:`${S.date}T${S.time}:00${TZ}`})});
    go(6);
  }catch(e){
    const m=ERR[e.message]||"Não foi possível agendar. Tente novamente.";
    $("#msg").textContent=m;btn.disabled=false;btn.textContent="Confirmar agendamento";
    if(["horario_ocupado","horario_passado","horario_bloqueado","horario_em_pausa"].includes(e.message))setTimeout(()=>go(3),1800);
  }
}
init();
</script>
</body>
</html>
